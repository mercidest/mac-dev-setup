# ============================================
#  tmux.conf — multi-session Claude setup
#  Each session gets a UNIQUE RANDOM color (@scolor), assigned on create by
#  ~/bin/tmux-assign-color.sh and freed automatically when the session dies.
# ============================================

# --- truecolor (needed for the hex colors, incl. over SSH) ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-256color:Tc"   # fallback for older tmux

# --- extended keys (Shift+Enter etc. pass through to apps like Claude Code) ---
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# Pi's TUI (pi-tui) needs csi-u specifically; `extended-keys on` alone leaves
# the format at tmux's xterm default and Pi warns at every startup.
set -g extended-keys-format csi-u

# --- prefix: Ctrl+Space (Ctrl+b is too awkward; language switching moved to Caps Lock) ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- general ---
set -g mouse on
set -s set-clipboard on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g history-limit 50000
set -sg escape-time 10           # snappier ESC, nicer over SSH

# --- iTerm2 tab/window title = session name (easy to tell tabs apart) ---
set -g set-titles on
set -g set-titles-string '#S  ›  #W'

# --- per-session color: assign on session create, and on config reload ---
set-hook -g session-created 'run-shell -b "~/bin/tmux-assign-color.sh"'
set-hook -g client-attached 'run-shell -b "~/bin/tmux-assign-color.sh"'

# Convenience: a color expression that falls back to grey if not assigned yet.
# (status/window formats expand #{} inside #[...] styles, so this is safe.)

# --- status bar ---
set -g status on
set -g status-interval 1     # 1s so the seconds in the clock actually tick
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#1a1b26 fg=#a9b1d6'
# Clear leftover component styles (e.g. the old green status-left-style) so the
# gaps inherit the dark bar background instead of a stray color.
set -g status-left-style default
set -g status-right-style default
set -g window-status-style default
set -g window-status-current-style default
set -g status-left-length 40
set -g status-right-length 60
# left: prefix indicator (0 normally, 1 while prefix is active), then the
# session chip painted in this session's unique color, then the window tabs
set -g status-left '#{?client_prefix,#[fg=#f7768e#,bold]1,#[fg=#565f89]0} #[fg=#414868]| #[fg=#1a1b26,bg=#{?@scolor,#{@scolor},#565f89},bold] #S #[default] '
# right: | <panes>p | hostname | 16 Jul | 17:14:18
set -g status-right '#[fg=#414868]| #[fg=#7aa2f7]#{window_panes}p #[fg=#414868]| #[fg=#a9b1d6]#h #[fg=#414868]| #[fg=#a9b1d6]%d %b #[fg=#414868]| #[fg=#7aa2f7]%H:%M:%S '
set -g window-status-separator ' '

# Windows are GREEN filled tabs — distinct from the session chip, and green is
# removed from the session palette so a session name can never be green.
# active window: bright-green filled tab, dark text
set -g window-status-current-format '#[fg=#1a1b26,bg=#9ece6a,bold] #I:#W #[default]'
# inactive window: muted-green filled tab
set -g window-status-format '#[fg=#cfe3b8,bg=#3d4d2c] #I:#W #[default]'

# --- pane borders ---
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'

# --- quality-of-life keybindings ---
# reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
# intuitive splits that keep the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# fuzzy-ish session switcher
bind s choose-tree -Zs

# Assign colors to any sessions that already exist at load time.
run-shell -b "~/bin/tmux-assign-color.sh"
